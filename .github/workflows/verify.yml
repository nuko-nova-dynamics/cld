name: Verify runner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runner:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test tests/runner.test.mjs
      - run: node --check scripts/claude-run.mjs && node --check scripts/run-execution.mjs && node --check tests/smoke.mjs
